<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ STT Admin Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* 공통 UI 컴포넌트 스타일링 */
        .glass-panel {
            @apply bg-slate-800/60 backdrop-blur-md p-6 rounded-2xl border border-slate-700/50 shadow-xl transition-all duration-300 hover:shadow-indigo-500/10 hover:border-slate-600/80;
        }
        .input-group {
            @apply flex flex-col gap-1 mb-4;
        }
        .input-label {
            @apply text-xs font-semibold text-slate-400 uppercase tracking-wider pl-1;
        }
        .input-field {
            @apply bg-slate-900/50 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-slate-200 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-500;
        }
        
        /* 버튼 스타일 (그라데이션 및 입체감) */
        .btn-gradient {
            @apply bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-semibold py-2.5 px-4 rounded-lg text-sm w-full transition-all shadow-lg hover:shadow-indigo-500/25 active:scale-[0.98] transform;
        }
        .btn-outline {
            @apply bg-transparent border border-slate-600 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-lg text-sm w-full transition-all active:scale-[0.98] transform;
        }
        .btn-alert {
            @apply bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-400 hover:to-orange-400 text-white font-semibold py-2.5 px-4 rounded-lg text-sm w-full transition-all shadow-lg hover:shadow-rose-500/25 active:scale-[0.98] transform;
        }

        /* 터미널 로그 콘솔 스타일 */
        .log-console {
            @apply bg-[#0d1117] text-emerald-400 font-mono text-xs p-4 rounded-xl mt-4 h-40 overflow-y-auto border border-slate-800 shadow-inner whitespace-pre-wrap leading-relaxed;
        }
        .log-console::-webkit-scrollbar { width: 6px; }
        .log-console::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen pb-12 antialiased bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 tracking-tight">
                    OnSTT API Workspace
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="checkHealth()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-full border border-slate-600 transition-colors shadow-sm flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    상태 갱신
                </button>
                <div id="health-status" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/50 rounded-full border border-slate-700 text-xs font-medium">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span>
                    </span>
                    <span class="text-slate-400">연결 대기</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-8 px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="glass-panel flex flex-col h-full">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700/50 pb-4">
                <span class="text-xl">👤</span>
                <h2 class="text-lg font-bold text-slate-100">계정 & 세션 관리</h2>
            </div>
            
            <div class="flex-grow">
                <div class="input-group">
                    <label class="input-label">사용자 생성</label>
                    <div class="flex gap-2">
                        <input type="text" id="user-name" placeholder="이름 (minsung)" class="input-field w-1/2">
                        <input type="text" id="user-level" placeholder="레벨 (N5)" class="input-field w-1/2">
                    </div>
                </div>
                <button onclick="createUser()" class="btn-gradient mb-6">Create User</button>

                <div class="input-group">
                    <label class="input-label">세션 생성</label>
                    <div class="flex gap-2">
                        <input type="number" id="session-user-id" placeholder="유저 ID" class="input-field w-1/3">
                        <input type="text" id="session-topic" placeholder="주제 입력" class="input-field w-2/3">
                    </div>
                </div>
                <button onclick="createSession()" class="btn-gradient mb-6">Create Session</button>

                <div class="input-group mb-0">
                    <label class="input-label">세션 목록 조회</label>
                    <div class="flex gap-2">
                        <input type="number" id="search-user-id" placeholder="유저 ID 입력" class="input-field w-2/3">
                        <button onclick="getSessions()" class="btn-outline w-1/3">조회</button>
                    </div>
                </div>
            </div>
            
            <div id="log-user" class="log-console mt-6">시스템 대기 중...</div>
        </div>

        <div class="glass-panel flex flex-col h-full">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700/50 pb-4">
                <span class="text-xl">🎙️</span>
                <h2 class="text-lg font-bold text-slate-100">발화(Utterance) 관리</h2>
            </div>

            <div class="flex-grow">
                <div class="input-group">
                    <label class="input-label">데이터 수동 적재</label>
                    <div class="flex gap-2 mb-2">
                        <input type="number" id="utt-session-id" placeholder="세션 ID" class="input-field w-1/3">
                        <input type="text" id="utt-model" placeholder="모델명" class="input-field w-2/3" value="manual-test">
                    </div>
                    <textarea id="utt-text" placeholder="STT 결과 텍스트를 입력하세요" class="input-field h-20 resize-none"></textarea>
                </div>
                <button onclick="createUtterance()" class="btn-gradient mb-6">Save Utterance</button>

                <div class="input-group">
                    <label class="input-label">세션 발화 목록 조회</label>
                    <div class="flex gap-2">
                        <input type="number" id="search-session-id" placeholder="세션 ID" class="input-field w-2/3">
                        <button onclick="getSessionUtterances()" class="btn-outline w-1/3">목록 조회</button>
                    </div>
                </div>

                <div class="input-group mb-0">
                    <label class="input-label">단일 발화 상세 조회</label>
                    <div class="flex gap-2">
                        <input type="number" id="search-utt-id" placeholder="발화 ID" class="input-field w-2/3">
                        <button onclick="getUtterance()" class="btn-outline w-1/3">상세 조회</button>
                    </div>
                </div>
            </div>

            <div id="log-utt" class="log-console mt-6">시스템 대기 중...</div>
        </div>

        <div class="glass-panel flex flex-col h-full border-indigo-500/20 shadow-indigo-500/5">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700/50 pb-4">
                <span class="text-xl">🧠</span>
                <h2 class="text
